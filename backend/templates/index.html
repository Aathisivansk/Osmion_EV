<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Charging Station</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 2rem; padding-bottom: 2rem; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .checkbox-group { display: flex; align-items: center; }
        input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
        button { width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background-color: #007bff; color: white; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
        .flash { padding: 1rem; margin-bottom: 1rem; border-radius: 8px; text-align: center; }
        .flash.success { background-color: #d4edda; color: #155724; }
        .flash.error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Charging Station</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form action="/add" method="POST">
            <div class="form-group"><label for="stationName">Station Name</label><input type="text" id="stationName" name="stationName" required></div>
            <div class="form-group"><label for="latitude">Latitude</label><input type="number" step="any" id="latitude" name="latitude" required></div>
            <div class="form-group"><label for="longitude">Longitude</label><input type="number" step="any" id="longitude" name="longitude" required></div>
            <div class="form-group"><label for="rating">Rating (e.g., 4.7)</label><input type="number" step="0.1" id="rating" name="rating" required></div>
            
            <div class="form-group">
                <label for="chargerType">Charger Type</label>
                <select id="chargerType" name="chargerType">
                    <option value="Both">AC / DC</option>
                    <option value="AC">AC Only</option>
                    <option value="DC">DC Only</option>
                </select>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="slotAvailable" name="slotAvailable">
                <label for="slotAvailable">Is a slot available now?</label>
            </div>

            <div class="form-group"><label for="sockets">Sockets (comma-separated)</label><input type="text" id="sockets" name="sockets" placeholder="e.g., CCS-2, Type 2 AC"></div>
            <div class="form-group"><label for="amenities">Amenities (comma-separated)</label><input type="text" id="amenities" name="amenities" placeholder="e.g., Restroom, Cafe, Wi-Fi"></div>
            
            <button type="submit">Add Station</button>
        </form>
    </div>
</body>
</html>
