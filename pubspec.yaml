name: osmion
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.2.3
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  dependencies:

  # For getting device location
  geolocator: ^13.0.4

  # Plugin for the user's location marker
  flutter_map_location_marker: ^9.0.1
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
