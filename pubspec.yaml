name: osmion
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Core mapping packages
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  
  # For getting device location
  geolocator: ^13.0.4
  
  # Plugin for the user's location marker
  flutter_map_location_marker: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
